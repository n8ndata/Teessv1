<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>ROUTER CENTRAL SYSTEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,Sarabun,sans-serif;background:#07111f;color:#f8fafc}
body{overflow:hidden;background:radial-gradient(ellipse at 15% 10%,#12304a 0,transparent 38%),radial-gradient(ellipse at 90% 85%,#241c48 0,transparent 35%),#07111f}
#home{height:100%;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.shell{width:min(100%,1050px);margin:auto}.brand{text-align:center;margin-bottom:36px}.logo{width:76px;height:76px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,#0891b2,#2563eb);box-shadow:0 18px 55px #0284c744;font-size:34px}
.eyebrow{font-size:11px;letter-spacing:.28em;font-weight:800;color:#67e8f9}.brand h1{font-size:clamp(27px,5vw,43px);line-height:1.12;margin:12px 0 8px;font-weight:900;letter-spacing:.025em}.brand p{margin:0;color:#9fb2c8;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.mode{position:relative;text-align:left;border:1px solid #ffffff20;border-radius:25px;padding:27px;background:linear-gradient(145deg,#142b40,#101b2d 72%);color:white;cursor:pointer;min-height:250px;transition:.22s;overflow:hidden}
.mode:before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-90px;top:-100px;background:var(--glow);filter:blur(4px);opacity:.28}.mode:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 20px 55px #0006}
.mode.analytics{--accent:#22d3ee;--glow:#0891b2}.mode.multi{--accent:#a78bfa;--glow:#7c3aed}
.mode-icon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-size:25px;margin-bottom:22px}
.mode small{display:block;color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.18em}.mode h2{font-size:22px;margin:8px 0 9px}.mode p{color:#b6c4d5;font-size:13px;line-height:1.65;margin:0;max-width:390px}.open{display:inline-flex;align-items:center;gap:10px;margin-top:23px;font-size:13px;font-weight:700;color:var(--accent)}
.footer{text-align:center;color:#62748a;font-size:11px;margin-top:27px}
#workspace{display:none;height:100%;flex-direction:column}.topbar{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:13px;padding:0 16px;background:#0b1728;border-bottom:1px solid #ffffff18;z-index:5}
.back{border:1px solid #ffffff24;background:#17263a;color:#e2e8f0;border-radius:11px;padding:8px 13px;font:600 12px Inter,Sarabun,sans-serif;cursor:pointer}.back:hover{background:#263b55}.current{font-size:13px;font-weight:700}.current span{color:#8ca2bb;font-weight:400;margin-left:8px}#appframe{border:0;width:100%;height:calc(100% - 54px);background:#0b1220;flex:1}
@media(max-width:700px){#home{padding:18px}.brand{margin-bottom:25px}.cards{grid-template-columns:1fr;gap:13px}.mode{min-height:0;padding:22px}.mode-icon{margin-bottom:15px}.open{margin-top:16px}.footer{margin-top:18px}}
</style>
</head>
<body>
<main id="home">
 <div class="shell">
  <header class="brand">
   <div class="logo"><i class="fa-solid fa-industry"></i></div>
   <div class="eyebrow">CENTRAL MANAGEMENT PLATFORM</div>
   <h1>ROUTER CENTRAL SYSTEM</h1>
   <p>ระบบจัดการและวิเคราะห์ข้อมูลเครื่องจักร ROUTER ในแพลตฟอร์มเดียว</p>
  </header>
  <section class="cards" aria-label="เลือกโหมดการทำงาน">
   <button class="mode analytics" onclick="openMode('machine-analytics/index.html','Machine Analytics','วิเคราะห์ข้อมูลและ Downtime')">
    <div class="mode-icon"><i class="fa-solid fa-chart-line"></i></div>
    <small>MODE 01</small><h2>Machine Analytics</h2>
    <p>ระบบวิเคราะห์ข้อมูลเครื่องจักร แสดงผล KPI, สถิติ, แนวโน้มปัญหา และ Downtime Dashboard</p>
    <span class="open">เข้าใช้งานโหมดนี้ <i class="fa-solid fa-arrow-right"></i></span>
   </button>
   <button class="mode multi" onclick="openMode('multi-machine/index.html','Multi-Machine System','จัดการข้อมูลและรายงานเครื่องจักร')">
    <div class="mode-icon"><i class="fa-solid fa-microchip"></i></div>
    <small>MODE 02</small><h2>Multi-Machine System</h2>
    <p>ระบบจัดการข้อมูลเครื่องจักรหลายเครื่อง บันทึกและติดตามรายงาน พร้อม Dashboard กลาง</p>
    <span class="open">เข้าใช้งานโหมดนี้ <i class="fa-solid fa-arrow-right"></i></span>
   </button>
  </section>
  <div class="footer">ROUTER CENTRAL SYSTEM · ALL-IN-ONE WORKSPACE · 2026</div>
 </div>
</main>
<section id="workspace">
 <div class="topbar">
  <button class="back" onclick="goHome()"><i class="fa-solid fa-house"></i> หน้าหลัก / เปลี่ยนโหมด</button>
  <div class="current" id="modeTitle">ROUTER SYSTEM <span id="modeDesc"></span></div>
 </div>
 <iframe id="appframe" title="ROUTER application" allow="camera; clipboard-read; clipboard-write"></iframe>
</section>
<script>
function openMode(path,title,desc){
 document.getElementById('appframe').src=path;
 document.getElementById('modeTitle').childNodes[0].textContent=title+' ';
 document.getElementById('modeDesc').textContent=desc;
 document.getElementById('home').style.display='none';
 document.getElementById('workspace').style.display='flex';
}
function goHome(){
 document.getElementById('appframe').src='about:blank';
 document.getElementById('workspace').style.display='none';
 document.getElementById('home').style.display='flex';
}
</script>
</body></html>
